name: iOS Sanity Check

on:
  workflow_dispatch:

jobs:
  sanity-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show macOS and Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document

      - name: Add VerseWidget extension target to Xcode project
        run: ruby ios/add_widget_extension.rb

      - name: Verify App Group entitlement is wired on both targets
        run: |
          set -e
          APP_GROUP="group.com.example.quranApp"

          for target in Runner VerseWidget; do
            echo "Checking $target build settings..."
            settings=$(xcodebuild -project ios/Runner.xcodeproj -target "$target" -configuration Debug -sdk iphonesimulator -showBuildSettings)
            entitlements_path=$(echo "$settings" | grep -m1 'CODE_SIGN_ENTITLEMENTS =' | sed 's/.*= //')

            if [ -z "$entitlements_path" ]; then
              echo "::error::$target has no CODE_SIGN_ENTITLEMENTS set"
              exit 1
            fi

            full_path="ios/$entitlements_path"
            if [ ! -f "$full_path" ]; then
              echo "::error::$target's entitlements file '$full_path' does not exist"
              exit 1
            fi

            if ! grep -q "$APP_GROUP" "$full_path"; then
              echo "::error::$full_path does not declare '$APP_GROUP'"
              exit 1
            fi

            echo "$target OK: $full_path declares $APP_GROUP"
          done

      - name: Build VerseWidget target
        run: |
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -target VerseWidget \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build full iOS app (Runner, with VerseWidget embedded)
        run: flutter build ios --no-codesign --simulator

      - name: DEBUG - dump entitlements actually embedded in the built binaries
        run: |
          set +e
          APP_PATH="build/ios/iphonesimulator/Runner.app"
          echo "::group::DEBUG - codesign -dv (signature summary) for Runner.app"
          codesign -dv "$APP_PATH" 2>&1
          echo "::endgroup::"

          echo "::group::DEBUG - codesign entitlements embedded in Runner.app"
          codesign -d --entitlements :- "$APP_PATH" 2>&1
          echo "::endgroup::"

          appex_path=$(find "$APP_PATH" -name "*.appex" -maxdepth 3 | head -n1)
          if [ -n "$appex_path" ]; then
            echo "::group::DEBUG - codesign entitlements embedded in $appex_path"
            codesign -d --entitlements :- "$appex_path" 2>&1
            echo "::endgroup::"
          else
            echo "DEBUG: no .appex found under $APP_PATH"
          fi
          set -e

      - name: Pick an iOS Simulator to run tests on
        id: simulator
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone Simulator found on this runner"
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run VerseWidget snapshot test
        run: |
          xcodebuild test \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RunnerTests/VerseWidgetSnapshotTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Collect widget screenshot
        run: |
          set -e
          if [ ! -f /tmp/verse_widget_snapshot.png ]; then
            echo "::error::Expected screenshot at /tmp/verse_widget_snapshot.png but the test did not produce it"
            exit 1
          fi
          mkdir -p artifacts
          cp /tmp/verse_widget_snapshot.png artifacts/verse_widget_snapshot.png

      - name: Upload widget screenshot
        uses: actions/upload-artifact@v4
        with:
          name: verse-widget-screenshot
          path: artifacts/verse_widget_snapshot.png
          if-no-files-found: error

      # The steps above only prove the widget can *render* App Group data.
      # These four exercise the tap-to-toggle-to-refresh loop added in this
      # stage: they install the real built app, tap the widget's URL via
      # `simctl openurl` (once cold, once warm), and read the App Group's
      # shared UserDefaults straight off disk to confirm `isRead` actually
      # flips both times.
      - name: Boot Simulator and install Runner app for widget round-trip check
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -e
          xcrun simctl bootstatus "$UDID" -b

          APP_PATH="build/ios/iphonesimulator/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected built app at $APP_PATH but it does not exist"
            exit 1
          fi
          xcrun simctl install "$UDID" "$APP_PATH"

      - name: Verify fresh launch pushes isRead=false to the App Group
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          BUNDLE_ID: com.example.quranApp
          APP_GROUP: group.com.example.quranApp
        run: |
          set -e
          source .github/scripts/widget_roundtrip_helpers.sh

          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID"

          # --- TEMPORARY DEBUG (remove once isRead round-trip is confirmed working) ---
          echo "::group::DEBUG - full App Group suite dump right after launch"
          xcrun simctl spawn "$UDID" defaults read "$APP_GROUP" 2>&1 || echo "DEBUG: defaults read exited non-zero (domain/key absent?)"
          echo "::endgroup::"

          echo "::group::DEBUG - defaults domains visible to the simulator's default user context"
          xcrun simctl spawn "$UDID" defaults domains 2>&1 || echo "DEBUG: defaults domains exited non-zero"
          echo "::endgroup::"
          # --- END TEMPORARY DEBUG ---

          if ! value=$(wait_for_key isRead false 30); then
            # --- TEMPORARY DEBUG (remove once isRead round-trip is confirmed working) ---
            echo "::group::DEBUG - full App Group suite dump after wait_for_key timeout"
            xcrun simctl spawn "$UDID" defaults read "$APP_GROUP" 2>&1 || echo "DEBUG: defaults read exited non-zero (domain/key absent?)"
            echo "::endgroup::"
            # --- END TEMPORARY DEBUG ---

            echo "::error::Expected isRead=false in the App Group after a fresh launch, last saw '$value'"
            exit 1
          fi
          echo "Fresh launch OK: isRead=$value"

      - name: Simulate a cold-start widget tap and verify isRead flips to true
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          BUNDLE_ID: com.example.quranApp
          APP_GROUP: group.com.example.quranApp
          TEST_VERSE_ID: 1
        run: |
          set -e
          source .github/scripts/widget_roundtrip_helpers.sh

          # Fully kill the app first so the tap below is a genuine cold
          # start, not a resume of an already-running process.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          sleep 2
          if [ -n "$(runner_pids)" ]; then
            echo "::error::Runner is still running after simctl terminate — cannot test the cold-start path"
            exit 1
          fi

          xcrun simctl openurl "$UDID" "homeWidget://toggleRead?id=${TEST_VERSE_ID}&homeWidget=true"

          if ! value=$(wait_for_key isRead true 30); then
            echo "::error::Cold-start widget tap did not flip isRead to true, last saw '$value'"
            exit 1
          fi
          echo "Cold-start tap OK: isRead=$value"

          if [ "$(runner_pid_count)" -ne 1 ]; then
            echo "::error::Expected the cold-start tap to leave exactly one Runner process running, found $(runner_pid_count)"
            exit 1
          fi

      - name: Simulate a warm-start widget tap and verify isRead flips back without duplicating the app
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          BUNDLE_ID: com.example.quranApp
          APP_GROUP: group.com.example.quranApp
          TEST_VERSE_ID: 1
        run: |
          set -e
          source .github/scripts/widget_roundtrip_helpers.sh

          pids_before="$(runner_pids)"
          if [ "$(runner_pid_count)" -ne 1 ]; then
            echo "::error::Expected exactly one Runner process running before the warm tap (pids: '$pids_before')"
            exit 1
          fi
          echo "Runner already running with pid $pids_before"

          xcrun simctl openurl "$UDID" "homeWidget://toggleRead?id=${TEST_VERSE_ID}&homeWidget=true"

          if ! value=$(wait_for_key isRead false 30); then
            echo "::error::Warm-start widget tap did not flip isRead back to false, last saw '$value'"
            exit 1
          fi
          echo "Warm-start tap OK: isRead=$value"

          pids_after="$(runner_pids)"
          if [ "$(runner_pid_count)" -ne 1 ]; then
            echo "::error::Expected exactly one Runner process after the warm tap (no crash, no duplicate instance); found pids '$pids_after'"
            exit 1
          fi
          if [ "$pids_after" != "$pids_before" ]; then
            echo "::error::Runner's process id changed from '$pids_before' to '$pids_after' — the warm tap relaunched the app instead of reusing the running instance"
            exit 1
          fi
          echo "Confirmed a single Runner instance (pid $pids_after) handled the warm tap"