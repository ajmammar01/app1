name: iOS Sanity Check

on:
  workflow_dispatch:

jobs:
  sanity-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show macOS and Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document

      - name: Add VerseWidget extension target to Xcode project
        run: ruby ios/add_widget_extension.rb

      - name: Verify App Group entitlement is wired on both targets
        run: |
          set -e
          APP_GROUP="group.com.example.quranApp"

          for target in Runner VerseWidget; do
            echo "Checking $target build settings..."
            settings=$(xcodebuild -project ios/Runner.xcodeproj -target "$target" -configuration Debug -sdk iphonesimulator -showBuildSettings)
            entitlements_path=$(echo "$settings" | grep -m1 'CODE_SIGN_ENTITLEMENTS =' | sed 's/.*= //')

            if [ -z "$entitlements_path" ]; then
              echo "::error::$target has no CODE_SIGN_ENTITLEMENTS set"
              exit 1
            fi

            full_path="ios/$entitlements_path"
            if [ ! -f "$full_path" ]; then
              echo "::error::$target's entitlements file '$full_path' does not exist"
              exit 1
            fi

            if ! grep -q "$APP_GROUP" "$full_path"; then
              echo "::error::$full_path does not declare '$APP_GROUP'"
              exit 1
            fi

            echo "$target OK: $full_path declares $APP_GROUP"
          done

      # Both build steps below deliberately build UNSIGNED
      # (CODE_SIGNING_ALLOWED=NO). Xcode's own signing pipeline is bypassed
      # entirely; the "Re-sign ... with our own entitlements" step further down
      # signs both products explicitly instead. See that step for the full
      # reasoning — in short, Xcode's automatic signing cannot resolve the App
      # Group capability without an authenticated Apple Developer account and
      # silently signs with an EMPTY entitlements set instead of failing.
      #
      # This is NOT the same as the earlier "--no-codesign left everything
      # unsigned" bug. That bug was that nothing signed the products afterward,
      # so they stayed permanently unsigned with no entitlements. Here the
      # unsigned build is only an intermediate state: the explicit codesign
      # step below runs before anything inspects, installs or runs these
      # bundles, so the end state is a full, correct ad-hoc signature carrying
      # the real App Group entitlement.
      - name: Build VerseWidget target
        run: |
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -target VerseWidget \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # `--no-codesign` makes the flutter tool append
      # CODE_SIGNING_ALLOWED=NO / CODE_SIGNING_REQUIRED=NO /
      # CODE_SIGNING_IDENTITY="" to its xcodebuild invocation
      # (flutter_tools/lib/src/ios/mac.dart), which is exactly the unsigned
      # intermediate state we want here. It also stops the tool adding
      # -allowProvisioningUpdates, so no Apple-account lookup is attempted at
      # any point.
      - name: Build full iOS app (Runner, with VerseWidget embedded)
        run: flutter build ios --no-codesign --simulator

      # Guards the bypass itself. Xcode's ProcessProductPackaging step is what
      # turns CODE_SIGN_ENTITLEMENTS into a .xcent plist for codesign, and it
      # only runs when signing is enabled. With CODE_SIGNING_ALLOWED=NO on both
      # builds above, it should not have run at all, so there should be no
      # .xcent files anywhere.
      #
      # If any appear, a build step has quietly regained Xcode's automatic
      # signing (a changed flag, or a future Flutter/Xcode version enabling it
      # by default). That must fail loudly here, because the entitlement check
      # further down would NOT catch it: the explicit re-signing step below
      # overwrites whatever Xcode produced, so a correct final signature would
      # mask the regression and we would be silently depending on the broken
      # automatic pipeline again.
      - name: Sanity check - Xcode generated no .xcent files
        run: |
          xcents=$(find build "$HOME/Library/Developer/Xcode/DerivedData" -name "*.xcent" 2>/dev/null || true)
          if [ -z "$xcents" ]; then
            echo "OK: no .xcent files - Xcode's signing pipeline was skipped as intended."
          else
            echo "$xcents" | while IFS= read -r xcent; do
              echo "::group::$xcent"
              plutil -p "$xcent" 2>&1 || cat "$xcent" 2>&1
              echo "::endgroup::"
            done
            echo "::error::Found .xcent files (listed above), so Xcode's automatic signing ran despite CODE_SIGNING_ALLOWED=NO. Entitlements must come only from the explicit codesign step, not from Xcode."
            exit 1
          fi

      # Why we sign by hand instead of letting Xcode do it.
      #
      # The App Group entitlement (com.apple.security.application-groups) is a
      # capability that Apple normally expects to be registered against an App
      # ID in a Developer account. When Xcode signs with its automatic style, it
      # tries to resolve that registration. On this runner there is no
      # authenticated Apple Developer account and no provisioning profile, so it
      # cannot - and instead of failing the build, it silently writes an EMPTY
      # entitlements set into the .xcent it hands to codesign. The result is a
      # perfectly valid signature carrying no entitlements, even though
      # CODE_SIGN_ENTITLEMENTS points at our correct .entitlements files the
      # whole time. That is why this was so hard to see: every static check
      # passes and only the built binary is wrong.
      #
      # (Xcode does also emit a separate *-Simulated.xcent containing the right
      # data, but that is an undocumented internal build artifact whose name and
      # existence can change between Xcode versions, so we do not build on it.)
      #
      # Signing ourselves removes Apple from the loop completely. Ad-hoc signing
      # ("--sign -") uses no certificate and no identity, and passing
      # --entitlements takes the entitlements verbatim from the file we give it
      # with no capability lookup, no App ID, no provisioning profile and no
      # account of any kind. Our tracked .entitlements files therefore become
      # the single source of truth for what ends up in the binary. This is the
      # standard way to sign for the Simulator without a provisioning-capable
      # Apple Developer account.
      #
      # Order matters: an app bundle's signature seals its nested code, so the
      # embedded .appex must be signed BEFORE Runner.app. Signing Runner.app
      # first would invalidate its own seal as soon as the extension changed.
      #
      # Paths are resolved the same way the rest of the workflow does it - the
      # flutter simulator build output, and the .appex located under PlugIns/
      # (matching .github/scripts/verify_entitlements.sh) - rather than a
      # hardcoded DerivedData path, which differs per runner and per build.
      - name: Re-sign VerseWidget.appex and Runner.app with our own entitlements
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphonesimulator/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected the built app at $APP_PATH but it does not exist"
            exit 1
          fi

          APPEX_PATH=$(find "$APP_PATH/PlugIns" -maxdepth 1 -name "*.appex" 2>/dev/null | head -n1)
          if [ -z "$APPEX_PATH" ]; then
            echo "::error::No .appex found under $APP_PATH/PlugIns - the widget extension was not embedded, so there is nothing to sign"
            exit 1
          fi

          echo "Signing extension: $APPEX_PATH"
          codesign --force --sign - \
            --entitlements ios/VerseWidget/VerseWidget.entitlements \
            --timestamp=none \
            "$APPEX_PATH"

          echo "Signing app: $APP_PATH"
          codesign --force --sign - \
            --entitlements ios/Runner/Runner.entitlements \
            --timestamp=none \
            "$APP_PATH"

      - name: Verify the App Group entitlement is embedded in the built binaries
        run: |
          bash .github/scripts/verify_entitlements.sh \
            build/ios/iphonesimulator/Runner.app \
            group.com.example.quranApp

      - name: Pick an iOS Simulator to run tests on
        id: simulator
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone Simulator found on this runner"
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # NOTE: this step still lets Xcode sign, unlike the two build steps above.
      # It builds its own copy of Runner.app into DerivedData as the test host,
      # separate from the bundle re-signed above, and that host's entitlements
      # will be empty for the reason described above. The snapshot test writes
      # and reads the App Group within a single process, so it does not depend
      # on the shared container actually being shared, and passes either way.
      # Left as-is deliberately rather than changed as a drive-by; if this host
      # ever needs the real entitlement, it needs the same re-signing treatment,
      # which is awkward here because `xcodebuild test` builds and runs in one
      # invocation with no point in between to sign.
      - name: Run VerseWidget snapshot test
        run: |
          xcodebuild test \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RunnerTests/VerseWidgetSnapshotTests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

      - name: Collect widget screenshot
        run: |
          set -e
          if [ ! -f /tmp/verse_widget_snapshot.png ]; then
            echo "::error::Expected screenshot at /tmp/verse_widget_snapshot.png but the test did not produce it"
            exit 1
          fi
          mkdir -p artifacts
          cp /tmp/verse_widget_snapshot.png artifacts/verse_widget_snapshot.png

      - name: Upload widget screenshot
        uses: actions/upload-artifact@v4
        with:
          name: verse-widget-screenshot
          path: artifacts/verse_widget_snapshot.png
          if-no-files-found: error

      # The steps above only prove the widget can *render* App Group data.
      # These four exercise the tap-to-toggle-to-refresh loop added in this
      # stage: they install the real built app, tap the widget's URL via
      # `simctl openurl` (once cold, once warm), and query the App Group's
      # shared UserDefaults via `defaults read` inside the simulator to confirm
      # `isRead` actually flips both times.
      - name: Boot Simulator and install Runner app for widget round-trip check
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          APP_GROUP: group.com.example.quranApp
        run: |
          set -e
          xcrun simctl bootstatus "$UDID" -b

          APP_PATH="build/ios/iphonesimulator/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected built app at $APP_PATH but it does not exist"
            exit 1
          fi

          # Re-check entitlements on the exact bundle about to be installed.
          # The snapshot-test step above also builds the Runner scheme, so this
          # catches the case where a later build overwrites this bundle with an
          # unsigned one after the post-build check already passed.
          bash .github/scripts/verify_entitlements.sh "$APP_PATH" "$APP_GROUP"

          xcrun simctl install "$UDID" "$APP_PATH"

      - name: Verify fresh launch pushes isRead=false to the App Group
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          BUNDLE_ID: com.example.quranApp
          APP_GROUP: group.com.example.quranApp
        run: |
          set -e
          source .github/scripts/widget_roundtrip_helpers.sh

          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID"

          # --- TEMPORARY DEBUG (remove once isRead round-trip is confirmed working) ---
          echo "::group::DEBUG - full App Group suite dump right after launch"
          xcrun simctl spawn "$UDID" defaults read "$APP_GROUP" 2>&1 || echo "DEBUG: defaults read exited non-zero (domain/key absent?)"
          echo "::endgroup::"

          echo "::group::DEBUG - defaults domains visible to the simulator's default user context"
          xcrun simctl spawn "$UDID" defaults domains 2>&1 || echo "DEBUG: defaults domains exited non-zero"
          echo "::endgroup::"
          # --- END TEMPORARY DEBUG ---

          if ! value=$(wait_for_key isRead false 30); then
            # --- TEMPORARY DEBUG (remove once isRead round-trip is confirmed working) ---
            echo "::group::DEBUG - full App Group suite dump after wait_for_key timeout"
            xcrun simctl spawn "$UDID" defaults read "$APP_GROUP" 2>&1 || echo "DEBUG: defaults read exited non-zero (domain/key absent?)"
            echo "::endgroup::"
            # --- END TEMPORARY DEBUG ---

            echo "::error::Expected isRead=false in the App Group after a fresh launch, last saw '$value'"
            exit 1
          fi
          echo "Fresh launch OK: isRead=$value"

      - name: Simulate a cold-start widget tap and verify isRead flips to true
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          BUNDLE_ID: com.example.quranApp
          APP_GROUP: group.com.example.quranApp
          TEST_VERSE_ID: 1
        run: |
          set -e
          source .github/scripts/widget_roundtrip_helpers.sh

          # Fully kill the app first so the tap below is a genuine cold
          # start, not a resume of an already-running process.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          sleep 2
          if [ -n "$(runner_pids)" ]; then
            echo "::error::Runner is still running after simctl terminate — cannot test the cold-start path"
            exit 1
          fi

          xcrun simctl openurl "$UDID" "homeWidget://toggleRead?id=${TEST_VERSE_ID}&homeWidget=true"

          if ! value=$(wait_for_key isRead true 30); then
            echo "::error::Cold-start widget tap did not flip isRead to true, last saw '$value'"
            exit 1
          fi
          echo "Cold-start tap OK: isRead=$value"

          if [ "$(runner_pid_count)" -ne 1 ]; then
            echo "::error::Expected the cold-start tap to leave exactly one Runner process running, found $(runner_pid_count)"
            exit 1
          fi

      - name: Simulate a warm-start widget tap and verify isRead flips back without duplicating the app
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          BUNDLE_ID: com.example.quranApp
          APP_GROUP: group.com.example.quranApp
          TEST_VERSE_ID: 1
        run: |
          set -e
          source .github/scripts/widget_roundtrip_helpers.sh

          pids_before="$(runner_pids)"
          if [ "$(runner_pid_count)" -ne 1 ]; then
            echo "::error::Expected exactly one Runner process running before the warm tap (pids: '$pids_before')"
            exit 1
          fi
          echo "Runner already running with pid $pids_before"

          xcrun simctl openurl "$UDID" "homeWidget://toggleRead?id=${TEST_VERSE_ID}&homeWidget=true"

          if ! value=$(wait_for_key isRead false 30); then
            echo "::error::Warm-start widget tap did not flip isRead back to false, last saw '$value'"
            exit 1
          fi
          echo "Warm-start tap OK: isRead=$value"

          pids_after="$(runner_pids)"
          if [ "$(runner_pid_count)" -ne 1 ]; then
            echo "::error::Expected exactly one Runner process after the warm tap (no crash, no duplicate instance); found pids '$pids_after'"
            exit 1
          fi
          if [ "$pids_after" != "$pids_before" ]; then
            echo "::error::Runner's process id changed from '$pids_before' to '$pids_after' — the warm tap relaunched the app instead of reusing the running instance"
            exit 1
          fi
          echo "Confirmed a single Runner instance (pid $pids_after) handled the warm tap"