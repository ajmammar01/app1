name: iOS Sanity Check

on:
  workflow_dispatch:

jobs:
  sanity-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show macOS and Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document

      - name: Add VerseWidget extension target to Xcode project
        run: ruby ios/add_widget_extension.rb

      - name: Verify App Group entitlement is wired on both targets
        run: |
          set -e
          APP_GROUP="group.com.example.quranApp"

          for target in Runner VerseWidget; do
            echo "Checking $target build settings..."
            settings=$(xcodebuild -project ios/Runner.xcodeproj -target "$target" -configuration Debug -sdk iphonesimulator -showBuildSettings)
            entitlements_path=$(echo "$settings" | grep -m1 'CODE_SIGN_ENTITLEMENTS =' | sed 's/.*= //')

            if [ -z "$entitlements_path" ]; then
              echo "::error::$target has no CODE_SIGN_ENTITLEMENTS set"
              exit 1
            fi

            full_path="ios/$entitlements_path"
            if [ ! -f "$full_path" ]; then
              echo "::error::$target's entitlements file '$full_path' does not exist"
              exit 1
            fi

            if ! grep -q "$APP_GROUP" "$full_path"; then
              echo "::error::$full_path does not declare '$APP_GROUP'"
              exit 1
            fi

            echo "$target OK: $full_path declares $APP_GROUP"
          done

      - name: Build VerseWidget target
        run: |
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -target VerseWidget \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build full iOS app (Runner, with VerseWidget embedded)
        run: flutter build ios --no-codesign --simulator

      - name: Pick an iOS Simulator to run tests on
        id: simulator
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone Simulator found on this runner"
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run VerseWidget snapshot test
        run: |
          xcodebuild test \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RunnerTests/VerseWidgetSnapshotTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Collect widget screenshot
        run: |
          set -e
          if [ ! -f /tmp/verse_widget_snapshot.png ]; then
            echo "::error::Expected screenshot at /tmp/verse_widget_snapshot.png but the test did not produce it"
            exit 1
          fi
          mkdir -p artifacts
          cp /tmp/verse_widget_snapshot.png artifacts/verse_widget_snapshot.png

      - name: Upload widget screenshot
        uses: actions/upload-artifact@v4
        with:
          name: verse-widget-screenshot
          path: artifacts/verse_widget_snapshot.png
          if-no-files-found: error