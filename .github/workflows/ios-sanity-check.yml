name: iOS Sanity Check

on:
  workflow_dispatch:

jobs:
  sanity-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show macOS and Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document

      - name: Add VerseWidget extension target to Xcode project
        run: ruby ios/add_widget_extension.rb

      - name: Build VerseWidget target
        run: |
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -target VerseWidget \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build full iOS app (Runner, with VerseWidget embedded)
        run: flutter build ios --no-codesign --simulator